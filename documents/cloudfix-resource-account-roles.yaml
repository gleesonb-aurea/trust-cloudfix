                Effect: Allow
                Resource: !Join
                  - ''
                  - - 'arn:aws:iam::'
                    - !Ref 'AWS::AccountId'
                    - ':role/cloudfix-ssm-assumed-role'
                    - !Ref ResourceSuffix
            Version: 2012-10-17
          PolicyName: s3-limited
